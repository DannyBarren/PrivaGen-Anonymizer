[project]
name = "privagen-anonymizer"
version = "0.1.0"
description = "GPU-first image anonymizer with typed PII eval"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--ignore=tests/test_edge_cases.py",
    "--ignore=tests/test_full_pipeline.py",
    "--ignore=tests/test_b2_full_roundtrip.py",
]
markers = [
    "slow: local/GPU integration scripts (not collected in CI)",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["scripts", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"evals/corpus.py" = ["E501"]
